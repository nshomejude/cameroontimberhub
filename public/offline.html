<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Offline — Cameroon Timber Hub</title>
    <style>
        :root { color-scheme: light; }
        body {
            margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
            background: #1b3425; color: #f5f0e6;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; text-align: center;
            padding: 2rem; padding-bottom: calc(2rem + env(safe-area-inset-bottom));
        }
        .card { max-width: 22rem; }
        .mark { width: 64px; height: 64px; margin: 0 auto 1.25rem; }
        h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
        p { color: #bcd8c2; line-height: 1.6; margin: 0 0 1.5rem; }
        button {
            border: 0; border-radius: 999px; padding: .75rem 1.5rem; font-weight: 600; font-size: .95rem;
            background: #cb9248; color: #0e1c14; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <svg class="mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="20" cy="20" r="20" fill="#254f35" />
            <circle cx="21" cy="20" r="14.6" stroke="#e6cca1" stroke-width="1.4" opacity="0.85" />
            <circle cx="22" cy="20.6" r="9.6" stroke="#e6cca1" stroke-width="1.4" opacity="0.7" />
            <circle cx="23" cy="21" r="4.9" stroke="#d7ac6c" stroke-width="1.4" opacity="0.8" />
            <circle cx="23.4" cy="21.3" r="1.7" fill="#d7ac6c" />
        </svg>
        <h1>You're offline</h1>
        <p>Cameroon Timber Hub needs a connection for this page. Check your network and try again.</p>
        <button onclick="location.reload()">Retry</button>
    </div>
</body>
</html>
