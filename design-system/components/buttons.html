<!-- @dsCard group="Components" name="Buttons & actions" subtitle="Primary, timber CTA, outline, text link" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/app.css">
  <style>
    :root {
      --color-forest-700: #254f35;
      --color-forest-900: #1b3425;
      --color-timber-400: #cb9248;
      --color-sand-50: #fbf9f4;
      --color-ink: #201e18;
    }
    .ds-stage {
      max-width: 900px;
      margin: 0 auto;
      padding: 48px 40px;
    }
    .ds-title {
      font-family: "Fraunces", serif;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--color-ink);
      margin: 0 0 32px;
    }
    .ds-grid {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 28px 24px;
      align-items: center;
    }
    .ds-caption {
      font-family: "Instrument Sans", sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #6b6555;
    }
    .ds-caption small {
      display: block;
      margin-top: 4px;
      font-weight: 500;
      letter-spacing: 0;
      text-transform: none;
      color: #9a9482;
      font-size: 11px;
    }
    .ds-row {
      display: flex;
      align-items: center;
    }
    .ds-darktile {
      background: #20402c;
      padding: 20px 24px;
      border-radius: 16px;
      display: inline-flex;
    }
    .ds-divider {
      grid-column: 1 / -1;
      height: 1px;
      background: rgba(32, 30, 24, 0.08);
    }
  </style>
</head>
<body class="bg-sand-50 text-ink antialiased">
  <div class="ds-stage">
    <h1 class="ds-title">Buttons &amp; actions</h1>

    <div class="ds-grid">

      <div class="ds-caption">Primary<small>Request a quote</small></div>
      <div class="ds-row">
        <button class="rounded-full bg-forest-700 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-forest-800">Request a quote</button>
      </div>

      <div class="ds-divider"></div>

      <div class="ds-caption">Large<small>Send request</small></div>
      <div class="ds-row">
        <button class="rounded-full bg-forest-700 px-7 py-3.5 text-sm font-semibold text-white transition hover:bg-forest-800">Send request</button>
      </div>

      <div class="ds-divider"></div>

      <div class="ds-caption">Timber CTA<small>Browse exporters</small></div>
      <div class="ds-row">
        <a class="inline-flex items-center gap-2 rounded-full bg-timber-400 px-7 py-3.5 text-sm font-semibold text-forest-950 transition hover:bg-timber-300">
          Browse exporters
          <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" data-slot="icon">
            <path fill-rule="evenodd" d="M3 10a.75.75 0 0 1 .75-.75h10.638L10.23 5.29a.75.75 0 1 1 1.04-1.08l5.5 5.25a.75.75 0 0 1 0 1.08l-5.5 5.25a.75.75 0 1 1-1.04-1.08l4.158-3.96H3.75A.75.75 0 0 1 3 10Z" clip-rule="evenodd"/>
          </svg>
        </a>
      </div>

      <div class="ds-divider"></div>

      <div class="ds-caption">Outline (on dark)<small>Explore species</small></div>
      <div class="ds-row">
        <span class="ds-darktile">
          <a class="rounded-full border border-forest-600 px-7 py-3.5 text-sm font-semibold text-sand-100 transition hover:bg-forest-700">Explore species</a>
        </span>
      </div>

      <div class="ds-divider"></div>

      <div class="ds-caption">Search<small>Search</small></div>
      <div class="ds-row">
        <button class="rounded-xl bg-forest-700 px-6 py-2.5 text-sm font-semibold text-white transition hover:bg-forest-800">Search</button>
      </div>

      <div class="ds-divider"></div>

      <div class="ds-caption">Text link<small>View all</small></div>
      <div class="ds-row">
        <a class="inline-flex items-center gap-1 text-sm font-semibold text-forest-700 transition hover:text-forest-900">
          View all
          <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" data-slot="icon">
            <path fill-rule="evenodd" d="M3 10a.75.75 0 0 1 .75-.75h10.638L10.23 5.29a.75.75 0 1 1 1.04-1.08l5.5 5.25a.75.75 0 0 1 0 1.08l-5.5 5.25a.75.75 0 1 1-1.04-1.08l4.158-3.96H3.75A.75.75 0 0 1 3 10Z" clip-rule="evenodd"/>
          </svg>
        </a>
      </div>

      <div class="ds-divider"></div>

      <div class="ds-caption">Secondary<small>Reset filters</small></div>
      <div class="ds-row">
        <button class="rounded-full border border-sand-300 px-5 py-2.5 text-sm font-medium text-ink-soft transition hover:border-forest-400 hover:text-forest-700">Reset filters</button>
      </div>

    </div>
  </div>
</body>
</html>
