<!-- @dsCard group="Components" name="Empty state & breadcrumb" subtitle="No-results card + breadcrumb" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/app.css">
  <style>
    :root {
      --color-forest-700:#254f35;
      --color-forest-900:#1b3425;
      --color-timber-400:#cb9248;
      --color-sand-50:#fbf9f4;
      --color-ink:#201e18;
    }
    .ds-stage {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 32px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .ds-stage > * { width: 100%; max-width: 720px; margin-left: auto; margin-right: auto; }
  </style>
</head>
<body class="bg-sand-50 text-ink antialiased">
  <div class="ds-stage">

    <nav class="flex items-center gap-1.5 text-sm">
      <a href="#" class="text-forest-700">Exporters</a>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" data-slot="icon" class="h-4 w-4 text-ink-soft">
        <path fill-rule="evenodd" d="M8.22 5.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L11.94 10 8.22 6.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd"/>
      </svg>
      <span class="text-ink">Bois du Cameroun SARL</span>
    </nav>

    <div class="rounded-2xl border border-dashed border-sand-300 bg-white p-14 text-center">
      <span class="mx-auto flex h-12 w-12 items-center justify-center rounded-xl bg-forest-50 text-forest-600">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" data-slot="icon" class="h-6 w-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
        </svg>
      </span>
      <h2 class="mt-4 font-display text-xl font-semibold text-forest-900">No verified exporters match these filters yet</h2>
      <p class="mt-2 text-ink-soft">Try broadening your search, or tell us what you need and we'll connect you.</p>
      <div class="mt-6 flex justify-center gap-3">
        <a href="#" class="rounded-full border border-sand-300 px-5 py-2.5 text-sm font-medium text-ink-soft transition hover:border-forest-400 hover:text-forest-700">Reset filters</a>
        <a href="#" class="rounded-full bg-forest-700 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-forest-800">Request a quote</a>
      </div>
    </div>

  </div>
</body>
</html>
