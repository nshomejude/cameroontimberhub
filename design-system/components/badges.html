<!-- @dsCard group="Components" name="Badges & pills" subtitle="Featured, Verified, CITES, status" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/app.css">
  <style>
    :root {
      --color-forest-700: #254f35;
      --color-forest-900: #1b3425;
      --color-timber-400: #cb9248;
      --color-sand-50: #fbf9f4;
      --color-ink: #201e18;
    }
    .ds-stage {
      max-width: 840px;
      margin: 0 auto;
      padding: 48px 40px 64px;
    }
    .ds-title {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 30px;
      letter-spacing: -0.01em;
      color: var(--color-ink);
      margin: 0 0 32px;
    }
    .ds-grid {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 28px 32px;
      align-items: center;
    }
    .ds-label {
      font-family: 'Instrument Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: #6b6657;
      line-height: 1.4;
    }
    .ds-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .ds-tile {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 16px 18px;
      border-radius: 16px;
    }
  </style>
</head>
<body class="bg-sand-50 text-ink antialiased">
  <div class="ds-stage">
    <h1 class="ds-title">Badges &amp; pills</h1>

    <div class="ds-grid">
      <div class="ds-label">Featured</div>
      <div class="ds-row">
        <span class="rounded-full bg-timber-100 px-2.5 py-0.5 text-xs font-semibold text-timber-800">Featured</span>
      </div>

      <div class="ds-label">Most popular</div>
      <div class="ds-row">
        <span class="rounded-full bg-forest-700 px-3 py-0.5 text-xs font-semibold text-white">Most popular</span>
      </div>

      <div class="ds-label">CITES &mdash; light</div>
      <div class="ds-row">
        <span class="rounded-full bg-timber-100 px-2.5 py-0.5 text-xs font-semibold text-timber-800">CITES II</span>
      </div>

      <div class="ds-label">CITES &mdash; dark / ring</div>
      <div class="ds-row">
        <div class="ds-tile" style="background:#1b3425;">
          <span class="rounded-full bg-timber-400/20 px-3 py-1 text-xs font-semibold text-timber-200 ring-1 ring-timber-400/40">CITES listed &mdash; Appendix II</span>
        </div>
      </div>

      <div class="ds-label">Verified profile &mdash; inline</div>
      <div class="ds-row">
        <span class="inline-flex items-center gap-1.5 text-sm font-medium text-forest-600">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" data-slot="icon" class="h-5 w-5">
            <path fill-rule="evenodd" d="M8.603 3.799A4.49 4.49 0 0 1 12 2.25c1.357 0 2.573.6 3.397 1.549a4.49 4.49 0 0 1 3.498 1.307 4.491 4.491 0 0 1 1.307 3.497A4.49 4.49 0 0 1 21.75 12a4.49 4.49 0 0 1-1.549 3.397 4.491 4.491 0 0 1-1.307 3.497 4.491 4.491 0 0 1-3.497 1.307A4.49 4.49 0 0 1 12 21.75a4.49 4.49 0 0 1-3.397-1.549 4.49 4.49 0 0 1-3.498-1.306 4.491 4.491 0 0 1-1.307-3.498A4.49 4.49 0 0 1 2.25 12c0-1.357.6-2.573 1.549-3.397a4.49 4.49 0 0 1 1.307-3.497 4.49 4.49 0 0 1 3.497-1.307Zm7.007 6.387a.75.75 0 1 0-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.14-.094l3.75-5.25Z" clip-rule="evenodd"/>
          </svg>
          Verified profile
        </span>
      </div>

      <div class="ds-label">Verified pill &mdash; dark</div>
      <div class="ds-row">
        <div class="ds-tile" style="background:#254f35;">
          <span class="inline-flex items-center gap-1.5 rounded-full bg-forest-700/70 px-3 py-1 text-sm font-medium text-white">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" data-slot="icon" class="h-4 w-4 text-timber-300">
              <path fill-rule="evenodd" d="M8.603 3.799A4.49 4.49 0 0 1 12 2.25c1.357 0 2.573.6 3.397 1.549a4.49 4.49 0 0 1 3.498 1.307 4.491 4.491 0 0 1 1.307 3.497A4.49 4.49 0 0 1 21.75 12a4.49 4.49 0 0 1-1.549 3.397 4.491 4.491 0 0 1-1.307 3.497 4.491 4.491 0 0 1-3.497 1.307A4.49 4.49 0 0 1 12 21.75a4.49 4.49 0 0 1-3.397-1.549 4.49 4.49 0 0 1-3.498-1.306 4.491 4.491 0 0 1-1.307-3.498A4.49 4.49 0 0 1 2.25 12c0-1.357.6-2.573 1.549-3.397a4.49 4.49 0 0 1 1.307-3.497 4.49 4.49 0 0 1 3.497-1.307Zm7.007 6.387a.75.75 0 1 0-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.14-.094l3.75-5.25Z" clip-rule="evenodd"/>
            </svg>
            Verified profile
          </span>
        </div>
      </div>

      <div class="ds-label">Species chip</div>
      <div class="ds-row">
        <span class="rounded-full bg-sand-100 px-2.5 py-1 text-xs font-medium text-ink-soft">Sapele</span>
      </div>

      <div class="ds-label">Market tag</div>
      <div class="ds-row">
        <span class="rounded-lg bg-sand-100 px-3 py-1.5 text-sm font-medium text-ink-soft">FR</span>
      </div>
    </div>
  </div>
</body>
</html>
