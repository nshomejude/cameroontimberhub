<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>

      --color-forest-900:#1b3425;
      --color-timber-400:#cb9248;
      --color-sand-50:#fbf9f4;
      --color-ink:#201e18;
    }
    .ds-stage {
      max-width: 460px;
      margin: 0 auto;
      padding: 40px 30px;
      box-sizing: border-box;
    }
    .ds-cell {
      width: 400px;
      max-width: 100%;
      margin: 0 auto;
    }
  </style>
</head>
<body class="bg-sand-50 text-ink antialiased">
  <div class="ds-stage">
    <div class="ds-cell">

        </div>

        <div class="mt-4 flex flex-wrap gap-1.5">
          <span class="rounded-full bg-sand-100 px-2.5 py-1 text-xs font-medium text-ink-soft">Sapele</span>
          <span class="rounded-full bg-sand-100 px-2.5 py-1 text-xs font-medium text-ink-soft">Iroko</span>
          <span class="rounded-full bg-sand-100 px-2.5 py-1 text-xs font-medium text-ink-soft">Ayous</span>
          <span class="rounded-full bg-sand-100 px-2.5 py-1 text-xs font-medium text-ink-soft">Tali</span>
        </div>

        <div class="mt-5 flex items-center justify-between border-t border-sand-100 pt-4">
          <span class="inline-flex items-center gap-1.5 text-sm font-medium text-forest-600">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" data-slot="icon" class="h-5 w-5">
