<!-- @dsCard group="Components" name="Hero search" subtitle="Home search bar + popular species" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/app.css">
  <style>
    :root {
      --color-forest-700:#254f35;
      --color-forest-900:#1b3425;
      --color-timber-400:#cb9248;
      --color-sand-50:#fbf9f4;
      --color-ink:#201e18;
    }
    .ds-stage {
      max-width: 760px;
      margin: 0 auto;
      padding: 56px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body class="bg-sand-50 text-ink antialiased">
  <div class="ds-stage">
    <form method="GET" action="#" class="mx-auto mt-9 flex max-w-xl items-center gap-2 rounded-2xl border border-sand-200 bg-white p-2 shadow-xl shadow-forest-900/5">
      <span class="pl-3 text-ink-soft"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" data-slot="icon" class="h-5 w-5">
  <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11ZM2 9a7 7 0 1 1 12.452 4.391l3.328 3.329a.75.75 0 1 1-1.06 1.06l-3.329-3.328A7 7 0 0 1 2 9Z" clip-rule="evenodd"/>
</svg></span>
      <input name="q" type="search" placeholder="Search verified exporters…"
             class="min-w-0 flex-1 border-0 bg-transparent py-2.5 text-base text-ink placeholder:text-ink-soft/60 focus:outline-none focus:ring-0">
      <button type="submit" class="shrink-0 rounded-xl bg-forest-700 px-6 py-2.5 text-sm font-semibold text-white transition hover:bg-forest-800">Search</button>
    </form>

    <div class="mt-5 flex flex-wrap items-center justify-center gap-2 text-sm">
      <span class="text-ink-soft">Popular species:</span>
      <a href="#" class="rounded-full border border-sand-200 bg-white/70 px-3 py-1 font-medium text-forest-800 transition hover:border-forest-300 hover:bg-white">Sapele</a>
      <a href="#" class="rounded-full border border-sand-200 bg-white/70 px-3 py-1 font-medium text-forest-800 transition hover:border-forest-300 hover:bg-white">Iroko</a>
      <a href="#" class="rounded-full border border-sand-200 bg-white/70 px-3 py-1 font-medium text-forest-800 transition hover:border-forest-300 hover:bg-white">Ayous</a>
      <a href="#" class="rounded-full border border-sand-200 bg-white/70 px-3 py-1 font-medium text-forest-800 transition hover:border-forest-300 hover:bg-white">Tali</a>
      <a href="#" class="rounded-full border border-sand-200 bg-white/70 px-3 py-1 font-medium text-forest-800 transition hover:border-forest-300 hover:bg-white">Padouk</a>
      <a href="#" class="rounded-full border border-sand-200 bg-white/70 px-3 py-1 font-medium text-forest-800 transition hover:border-forest-300 hover:bg-white">Bubinga</a>
    </div>
  </div>
</body>
</html>
