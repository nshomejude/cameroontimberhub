<!-- @dsCard group="Screens" name="Quote form screen" subtitle="No-account RFQ" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/app.css">
  <style>
    :root {
      --color-forest-700: #254f35;
      --color-forest-900: #1b3425;
      --color-timber-400: #cb9248;
      --color-sand-50: #fbf9f4;
      --color-ink: #201e18;
    }
    .ds-stage {
      max-width: 480px;
      margin: 0 auto;
      padding: 32px 16px;
      display: flex;
      justify-content: center;
    }
    .phone-frame {
      width: 390px;
      height: 900px;
      background: #15130f;
      border-radius: 44px;
      padding: 10px;
      box-shadow: 0 30px 70px -20px rgba(20,18,12,.55), 0 0 0 1px rgba(0,0,0,.2);
    }
    .phone-screen {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--color-sand-50);
      border-radius: 34px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .phone-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .phone-scroll::-webkit-scrollbar { width: 0; }
  </style>
</head>
<body class="bg-sand-50 text-ink antialiased">
  <div class="ds-stage">
    <div class="phone-frame">
      <div class="phone-screen">

        <!-- Top app bar (DETAIL state: back + title) -->
        <header class="app-bar sticky top-0 z-30 flex items-center gap-2 border-b border-sand-200 bg-sand-50/90 px-3 backdrop-blur">
          <a href="#" class="-ml-1 flex h-10 w-10 items-center justify-center rounded-full text-forest-800 active:bg-sand-200">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" data-slot="icon" class="h-6 w-6">
              <path fill-rule="evenodd" d="M11.78 5.22a.75.75 0 0 1 0 1.06L8.06 10l3.72 3.72a.75.75 0 1 1-1.06 1.06l-4.25-4.25a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 0Z" clip-rule="evenodd"/>
            </svg>
          </a>
          <h1 class="truncate font-display text-base font-semibold text-forest-900">Request a quote</h1>
          <div class="ml-auto flex items-center gap-1"></div>
        </header>

        <!-- Scrollable page content -->
        <div class="phone-scroll">

          <section class="border-b border-sand-200 bg-gradient-to-b from-forest-50 to-sand-50">
            <div class="mx-auto max-w-3xl px-4 py-12">
              <p class="eyebrow">No account needed</p>
              <h1 class="mt-3 font-display text-4xl font-semibold text-forest-950">Request a quote</h1>
              <p class="mt-3 text-ink-soft">Describe what you need; we'll route it to verified exporters.</p>
            </div>
          </section>

          <section class="mx-auto max-w-3xl px-4 py-10">
            <form class="space-y-8">

              <fieldset class="space-y-4">
                <legend class="font-display text-xl font-semibold text-forest-900">What you need</legend>
                <div class="grid gap-4 sm:grid-cols-2">
                  <div>
                    <label class="mb-1 block text-sm font-medium text-ink-soft">Species</label>
                    <select class="w-full rounded-lg border border-sand-300 bg-white px-3 py-2.5 text-ink focus:border-forest-500 focus:ring-2 focus:ring-forest-100 focus:outline-none">
                      <option>Sapele</option>
                      <option>Iroko</option>
                      <option>Ayous</option>
                    </select>
                  </div>
                  <div>
                    <label class="mb-1 block text-sm font-medium text-ink-soft">Product form *</label>
                    <select class="w-full rounded-lg border border-sand-300 bg-white px-3 py-2.5 text-ink focus:border-forest-500 focus:ring-2 focus:ring-forest-100 focus:outline-none">
                      <option>Logs</option>
                      <option>Sawn</option>
                      <option>Veneer</option>
                    </select>
                  </div>
                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="mb-1 block text-sm font-medium text-ink-soft">Quantity *</label>
                      <input type="number" step="0.01" class="w-full rounded-lg border border-sand-300 bg-white px-3 py-2.5 text-ink focus:border-forest-500 focus:ring-2 focus:ring-forest-100 focus:outline-none">
                    </div>
                    <div>
                      <label class="mb-1 block text-sm font-medium text-ink-soft">Unit *</label>
                      <select class="w-full rounded-lg border border-sand-300 bg-white px-3 py-2.5 text-ink focus:border-forest-500 focus:ring-2 focus:ring-forest-100 focus:outline-none">
                        <option>m3</option>
                        <option>ton</option>
                        <option>pcs</option>
                      </select>
                    </div>
                  </div>
                  <input type="text" class="w-full rounded-lg border border-sand-300 bg-white px-3 py-2.5 text-ink focus:border-forest-500 focus:ring-2 focus:ring-forest-100 focus:outline-none" placeholder="Grade (optional)">
                </div>
              </fieldset>

              <fieldset class="space-y-4">
                <legend class="font-display text-xl font-semibold text-forest-900">Your details</legend>
                <div class="grid gap-4 sm:grid-cols-2">
                  <input type="text" class="w-full rounded-lg border border-sand-300 bg-white px-3 py-2.5 text-ink focus:border-forest-500 focus:ring-2 focus:ring-forest-100 focus:outline-none" placeholder="Your name *" required>
                  <input type="email" class="w-full rounded-lg border border-sand-300 bg-white px-3 py-2.5 text-ink focus:border-forest-500 focus:ring-2 focus:ring-forest-100 focus:outline-none" placeholder="Email *" required>
                  <input type="text" class="w-full rounded-lg border border-sand-300 bg-white px-3 py-2.5 text-ink focus:border-forest-500 focus:ring-2 focus:ring-forest-100 focus:outline-none" placeholder="Company (optional)">
                  <input type="text" maxlength="2" class="w-full rounded-lg border border-sand-300 bg-white px-3 py-2.5 text-ink focus:border-forest-500 focus:ring-2 focus:ring-forest-100 focus:outline-none" placeholder="Destination country (2-letter) *" required>
                  <select class="w-full rounded-lg border border-sand-300 bg-white px-3 py-2.5 text-ink focus:border-forest-500 focus:ring-2 focus:ring-forest-100 focus:outline-none">
                    <option value="">Incoterm (optional)</option>
                    <option>EXW</option>
                    <option>FOB</option>
                    <option>CIF</option>
                  </select>
                </div>
                <textarea rows="4" class="w-full rounded-lg border border-sand-300 bg-white px-3 py-2.5 text-ink focus:border-forest-500 focus:ring-2 focus:ring-forest-100 focus:outline-none" placeholder="Describe your requirements *" required></textarea>
              </fieldset>

              <label class="flex items-start gap-2 text-sm text-ink-soft">
                <input type="checkbox" value="1" class="mt-1 rounded border-sand-300" required>
                <span>I consent to Cameroon Timber Hub sharing this request with verified exporters and contacting me by email.</span>
              </label>

              <button type="submit" class="rounded-full bg-forest-700 px-7 py-3.5 text-sm font-semibold text-white transition hover:bg-forest-800">
                Send request
              </button>
            </form>
          </section>

        </div>

        <!-- Bottom tab bar (Quote active) -->
        <nav class="tab-bar grid grid-cols-5 border-t border-sand-200 bg-white/95 backdrop-blur">
          <a href="#" class="flex flex-col items-center justify-center gap-0.5 py-2 text-[11px] font-medium transition active:scale-95 text-ink-soft">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" data-slot="icon" class="h-6 w-6">
              <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/>
            </svg>
            Home
          </a>
          <a href="#" class="flex flex-col items-center justify-center gap-0.5 py-2 text-[11px] font-medium transition active:scale-95 text-ink-soft">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" data-slot="icon" class="h-6 w-6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 21h19.5m-18-18v18m10.5-18v18m6-13.5V21M6.75 6.75h.75m-.75 3h.75m-.75 3h.75m3-6h.75m-.75 3h.75m-.75 3h.75M6.75 21v-3.375c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21M3 3h12m-.75 4.5H21m-3.75 3.75h.008v.008h-.008v-.008Zm0 3h.008v.008h-.008v-.008Zm0 3h.008v.008h-.008v-.008Z"/>
            </svg>
            Exporters
          </a>
          <a href="#" class="flex flex-col items-center justify-center gap-0.5 py-2 text-[11px] font-medium transition active:scale-95 text-ink-soft">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" data-slot="icon" class="h-6 w-6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 6.878V6a2.25 2.25 0 0 1 2.25-2.25h7.5A2.25 2.25 0 0 1 18 6v.878m-12 0c.235-.083.487-.128.75-.128h10.5c.263 0 .515.045.75.128m-12 0A2.25 2.25 0 0 0 4.5 9v.878m13.5-3A2.25 2.25 0 0 1 19.5 9v.878m0 0a2.246 2.246 0 0 0-.75-.128H5.25c-.263 0-.515.045-.75.128m15 0A2.25 2.25 0 0 1 21 12v6a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 18v-6c0-.98.626-1.813 1.5-2.122"/>
            </svg>
            Species
          </a>
          <a href="#" class="flex flex-col items-center justify-center gap-0.5 py-2 text-[11px] font-medium transition active:scale-95 text-forest-700">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" data-slot="icon" class="h-6 w-6">
              <path d="M4.913 2.658c2.075-.27 4.19-.408 6.337-.408 2.147 0 4.262.139 6.337.408 1.922.25 3.291 1.861 3.405 3.727a4.403 4.403 0 0 0-1.032-.211 50.89 50.89 0 0 0-8.42 0c-2.358.196-4.04 2.19-4.04 4.434v4.286a4.47 4.47 0 0 0 2.433 3.984L7.28 21.53A.75.75 0 0 1 6 21v-4.03a48.527 48.527 0 0 1-1.087-.128C2.905 16.58 1.5 14.833 1.5 12.862V6.638c0-1.97 1.405-3.718 3.413-3.979Z"/>
              <path d="M15.75 7.5c-1.376 0-2.739.057-4.086.169C10.124 7.797 9 9.103 9 10.609v4.285c0 1.507 1.128 2.814 2.67 2.94 1.243.102 2.5.157 3.768.165l2.782 2.781a.75.75 0 0 0 1.28-.53v-2.39l.33-.026c1.542-.125 2.67-1.433 2.67-2.94v-4.286c0-1.505-1.125-2.811-2.664-2.94A49.392 49.392 0 0 0 15.75 7.5Z"/>
            </svg>
            Quote
          </a>
          <a href="#" class="flex flex-col items-center justify-center gap-0.5 py-2 text-[11px] font-medium transition active:scale-95 text-ink-soft">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" data-slot="icon" class="h-6 w-6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
            </svg>
            Account
          </a>
        </nav>

      </div>
    </div>
  </div>
</body>
</html>
