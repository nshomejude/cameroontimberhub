<!-- @dsCard group="App shell" name="Offline screen" subtitle="PWA offline fallback" -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/app.css">
    <style>
        :root {
            --color-forest-700:#254f35;
            --color-forest-900:#1b3425;
            --color-timber-400:#cb9248;
            --color-sand-50:#fbf9f4;
            --color-ink:#201e18;
        }
        .ds-stage {
            max-width: 430px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem;
            display: flex;
            justify-content: center;
        }
        .offline-tile {
            width: 390px;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 20px 50px -20px rgba(27,52,37,.55);
        }
        /* Offline screen's own styles, scoped to the tile */
        .offline-tile .offline-screen {
            margin: 0; min-height: 560px; display: flex; align-items: center; justify-content: center;
            background: #1b3425; color: #f5f0e6;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; text-align: center;
            padding: 2rem;
            box-sizing: border-box;
        }
        .offline-tile .card { max-width: 22rem; }
        .offline-tile .mark { width: 64px; height: 64px; margin: 0 auto 1.25rem; }
        .offline-tile h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
        .offline-tile p { color: #bcd8c2; line-height: 1.6; margin: 0 0 1.5rem; }
        .offline-tile button {
            border: 0; border-radius: 999px; padding: .75rem 1.5rem; font-weight: 600; font-size: .95rem;
            background: #cb9248; color: #0e1c14; cursor: pointer;
        }
    </style>
</head>
<body class="bg-sand-50 text-ink antialiased">
    <div class="ds-stage">
        <div class="offline-tile">
            <div class="offline-screen">
                <div class="card">
                    <svg class="mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <circle cx="20" cy="20" r="20" fill="#254f35" />
                        <circle cx="21" cy="20" r="14.6" stroke="#e6cca1" stroke-width="1.4" opacity="0.85" />
                        <circle cx="22" cy="20.6" r="9.6" stroke="#e6cca1" stroke-width="1.4" opacity="0.7" />
                        <circle cx="23" cy="21" r="4.9" stroke="#d7ac6c" stroke-width="1.4" opacity="0.8" />
                        <circle cx="23.4" cy="21.3" r="1.7" fill="#d7ac6c" />
                    </svg>
                    <h1>You're offline</h1>
                    <p>Cameroon Timber Hub needs a connection for this page. Check your network and try again.</p>
                    <button>Retry</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
