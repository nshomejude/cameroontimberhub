<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/app.css">
    <style>
        :root {
            --color-forest-700: #254f35;
            --color-forest-900: #1b3425;
            --color-timber-400: #cb9248;
            --color-sand-50: #fbf9f4;
            --color-sand-200: #e7e0d2;
            --color-ink: #201e18;
            --color-ink-soft: #6b6557;
        }
        .ds-stage {
            max-width: 430px;
            margin: 0 auto;
            padding: 32px 20px 48px;
            box-sizing: border-box;
        }
        .ds-title {
            font-family: "Fraunces", serif;
            font-weight: 600;
            font-size: 22px;
            color: var(--color-forest-900);
            margin: 0 0 24px;
        }
        .ds-tile {
            width: 390px;
            max-width: 100%;
            height: 200px;
            background: var(--color-sand-50);
            border: 1px solid var(--color-sand-200);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            margin: 0 auto 28px;
            box-shadow: 0 1px 2px rgba(32, 30, 24, 0.05);
        }
        /* Pin the tab bar to the bottom of each tile (overrides the app's fixed positioning) */
        .ds-tile .tab-bar {
            position: absolute;
        }
    </style>
</head>
