<!-- @dsCard group="App shell" name="Top app bar" subtitle="Brand state + back state" -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/app.css">
    <style>
        :root {
            --color-forest-700: #254f35;
            --color-forest-800: #1f4129;
            --color-forest-900: #1b3425;
            --color-timber-400: #cb9248;
            --color-sand-50: #fbf9f4;
            --color-sand-200: #ece5d6;
            --color-ink: #201e18;
        }
        .ds-stage {
            max-width: 430px;
            margin: 0 auto;
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }
        .ds-label {
            font-family: "Instrument Sans", system-ui, sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #8a8472;
            margin: 0 0 10px 2px;
        }
        .ds-tile {
            width: 390px;
            max-width: 100%;
            border: 1px solid var(--color-sand-200);
            border-radius: 18px;
            overflow: hidden;
            background: var(--color-sand-50);
            box-shadow: 0 1px 2px rgba(32, 30, 24, 0.05);
        }
    </style>
</head>
<body class="bg-sand-50 text-ink antialiased">
    <div class="ds-stage">

        <section>
            <p class="ds-label">A — Root (brand)</p>
            <div class="ds-tile">
                <header class="app-bar sticky top-0 z-30 flex items-center gap-2 border-b border-sand-200 bg-sand-50/90 px-3 backdrop-blur">
                    <span class="ml-1 md:hidden">
                        <svg class="h-8 w-8" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <circle cx="20" cy="20" r="20" fill="#254f35" />
                            <circle cx="21" cy="20" r="14.6" stroke="#e6cca1" stroke-width="1.4" opacity="0.85" />
                            <circle cx="22" cy="20.6" r="9.6" stroke="#e6cca1" stroke-width="1.4" opacity="0.7" />
                            <circle cx="23" cy="21" r="4.9" stroke="#d7ac6c" stroke-width="1.4" opacity="0.8" />
                            <circle cx="23.4" cy="21.3" r="1.7" fill="#d7ac6c" />
                        </svg>
                    </span>
                    <h1 class="truncate font-display text-base font-semibold text-forest-900">Cameroon Timber Hub</h1>
                    <div class="ml-auto flex items-center gap-1"></div>
                </header>
            </div>
        </section>

        <section>
            <p class="ds-label">B — Detail (back)</p>
            <div class="ds-tile">
                <header class="app-bar sticky top-0 z-30 flex items-center gap-2 border-b border-sand-200 bg-sand-50/90 px-3 backdrop-blur">
                    <a href="#" class="-ml-1 flex h-10 w-10 items-center justify-center rounded-full text-forest-800 active:bg-sand-200">
                        <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" data-slot="icon">
                            <path fill-rule="evenodd" d="M11.78 5.22a.75.75 0 0 1 0 1.06L8.06 10l3.72 3.72a.75.75 0 1 1-1.06 1.06l-4.25-4.25a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 0Z" clip-rule="evenodd"/>
                        </svg>
                    </a>
                    <h1 class="truncate font-display text-base font-semibold text-forest-900">Bois du Cameroun SARL</h1>
                    <div class="ml-auto flex items-center gap-1"></div>
                </header>
            </div>
        </section>

    </div>
</body>
</html>
