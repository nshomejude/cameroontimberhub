<!-- @dsCard group="Foundations" name="Brand mark" subtitle="Timber growth-ring logo, sizes & lockup" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/app.css">
  <style>
    :root {
      --color-forest-700: #254f35;
      --color-forest-900: #1b3425;
      --color-timber-400: #cb9248;
      --color-sand-50: #fbf9f4;
      --color-ink: #201e18;
    }
    .ds-stage {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 40px;
    }
    .ds-title {
      font-family: "Fraunces", serif;
      font-size: 28px;
      font-weight: 600;
      color: var(--color-forest-900);
      margin: 0 0 6px;
    }
    .ds-caption {
      font-family: "Instrument Sans", sans-serif;
      font-size: 14px;
      color: #6b665a;
      margin: 0 0 36px;
    }
    .ds-row {
      display: flex;
      align-items: flex-end;
      gap: 40px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }
    .ds-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .ds-spec {
      font-family: "Instrument Sans", sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: #8a8475;
      letter-spacing: 0.02em;
    }
    .ds-dark-tile {
      background: var(--color-forest-900);
      border-radius: 20px;
      padding: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .ds-section-label {
      font-family: "Instrument Sans", sans-serif;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #a09a89;
      margin: 0 0 18px;
    }
    .ds-lockup {
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }
  </style>
</head>
<body class="bg-sand-50 text-ink antialiased">
  <div class="ds-stage">
    <h1 class="ds-title">Brand mark</h1>
    <p class="ds-caption">Off-centre timber growth-rings on forest green.</p>

    <p class="ds-section-label">Sizes</p>
    <div class="ds-row">
      <div class="ds-item">
        <svg style="width:36px;height:36px;" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="20" cy="20" r="20" fill="#254f35" />
          <circle cx="21" cy="20" r="14.6" stroke="#e6cca1" stroke-width="1.4" opacity="0.85" />
          <circle cx="22" cy="20.6" r="9.6" stroke="#e6cca1" stroke-width="1.4" opacity="0.7" />
          <circle cx="23" cy="21" r="4.9" stroke="#d7ac6c" stroke-width="1.4" opacity="0.8" />
          <circle cx="23.4" cy="21.3" r="1.7" fill="#d7ac6c" />
        </svg>
        <span class="ds-spec">36px</span>
      </div>
      <div class="ds-item">
        <svg style="width:64px;height:64px;" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="20" cy="20" r="20" fill="#254f35" />
          <circle cx="21" cy="20" r="14.6" stroke="#e6cca1" stroke-width="1.4" opacity="0.85" />
          <circle cx="22" cy="20.6" r="9.6" stroke="#e6cca1" stroke-width="1.4" opacity="0.7" />
          <circle cx="23" cy="21" r="4.9" stroke="#d7ac6c" stroke-width="1.4" opacity="0.8" />
          <circle cx="23.4" cy="21.3" r="1.7" fill="#d7ac6c" />
        </svg>
        <span class="ds-spec">64px</span>
      </div>
      <div class="ds-item">
        <svg style="width:128px;height:128px;" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="20" cy="20" r="20" fill="#254f35" />
          <circle cx="21" cy="20" r="14.6" stroke="#e6cca1" stroke-width="1.4" opacity="0.85" />
          <circle cx="22" cy="20.6" r="9.6" stroke="#e6cca1" stroke-width="1.4" opacity="0.7" />
          <circle cx="23" cy="21" r="4.9" stroke="#d7ac6c" stroke-width="1.4" opacity="0.8" />
          <circle cx="23.4" cy="21.3" r="1.7" fill="#d7ac6c" />
        </svg>
        <span class="ds-spec">128px</span>
      </div>
    </div>

    <p class="ds-section-label">On dark</p>
    <div class="ds-row">
      <div class="ds-item">
        <div class="ds-dark-tile">
          <svg style="width:72px;height:72px;" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="20" cy="20" r="20" fill="#254f35" />
            <circle cx="21" cy="20" r="14.6" stroke="#e6cca1" stroke-width="1.4" opacity="0.85" />
            <circle cx="22" cy="20.6" r="9.6" stroke="#e6cca1" stroke-width="1.4" opacity="0.7" />
            <circle cx="23" cy="21" r="4.9" stroke="#d7ac6c" stroke-width="1.4" opacity="0.8" />
            <circle cx="23.4" cy="21.3" r="1.7" fill="#d7ac6c" />
          </svg>
        </div>
        <span class="ds-spec">forest-900 tile</span>
      </div>
    </div>

    <p class="ds-section-label">Lockup</p>
    <div class="ds-lockup">
      <svg style="width:36px;height:36px;" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="20" cy="20" r="20" fill="#254f35" />
        <circle cx="21" cy="20" r="14.6" stroke="#e6cca1" stroke-width="1.4" opacity="0.85" />
        <circle cx="22" cy="20.6" r="9.6" stroke="#e6cca1" stroke-width="1.4" opacity="0.7" />
        <circle cx="23" cy="21" r="4.9" stroke="#d7ac6c" stroke-width="1.4" opacity="0.8" />
        <circle cx="23.4" cy="21.3" r="1.7" fill="#d7ac6c" />
      </svg>
      <span class="font-display text-base font-semibold text-forest-900">Cameroon Timber Hub</span>
    </div>
  </div>
</body>
</html>
